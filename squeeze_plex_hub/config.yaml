name: Squeeze Plex Hub
# Mis à jour automatiquement par .github/workflows/update-squeeze-plex-hub.yml
# (= tag de l'image onmomo/squeeze-plex-hub utilisée par le Dockerfile)
version: "1.54.0"
slug: squeeze_plex_hub
description: Diffuse Plexamp vers les lecteurs Squeezebox / Lyrion (image officielle onmomo/squeeze-plex-hub)
url: https://github.com/onmomo/squeeze-plex-hub
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Réseau de l'hôte obligatoire : découverte LMS (UDP 3483) et GDM Plex (UDP 32412) par diffusion
host_network: true
ports:
  3000/tcp: 3000
ports_description:
  3000/tcp: Tableau de bord Squeeze Plex Hub
webui: "http://[HOST]:[PORT:3000]/"
